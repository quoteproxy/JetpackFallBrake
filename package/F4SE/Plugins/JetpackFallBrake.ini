[General]
; 1 = firing the jetpack while falling brakes the fall and eases into a normal climb, then the game takes over.
; Takeoffs and climbs that do not start from a fall are left to the game. 0 = vanilla behaviour.
bEnabled=1
; 1 = firing the jetpack during any fall starts from the real fall speed. The game does this only when falling
; faster than 700 units/s; otherwise the jetpack starts from 0 or from the speed it had when last released, so
; firing during a slow fall jumped straight up. 0 = the game's own rule.
bRealFallSpeed=1
; Climb speed a recovery from a fall eases into before handing over to the game (units/s). -1 = the speed of a
; ground takeoff at 60 fps, from the game settings (about 361 with Flying Jetpack; an initial thrust longer than
; 1 s counts only for its first second). About 0 with a jetpack that only holds altitude: the fall is stopped
; and the jetpack hovers.
fClimbSpeed=-1
; Strongest acceleration, used against a fast fall (units/s^2). Gravity is about 687.
fBrakeAccel=3000
; Speed range (units/s) over which the push fades out as the fall slows and the climb speed is reached.
; Larger = a gentler, longer transition. Smaller = a quicker, firmer one.
fEaseSpeed=1500
; Time constant (s) for the thrust to build up when it is first fired. 0.1 = about 0.3 s to full power.
fThrustRampTime=0.1
; 1 = fall damage after using the jetpack follows the landing speed (a soft landing after braking is safe).
; 0 = the game's own rule (the whole drop from where the fall started counts, even after braking).
bFallDamageFromSpeed=1
